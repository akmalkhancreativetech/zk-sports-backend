; Production PHP settings for the app container.

; The admin panel uploads product and slider images. PHP's 2M default truncates
; them, and nginx's client_max_body_size is matched to post_max_size.
upload_max_filesize = 20M
post_max_size = 25M

memory_limit = 256M
max_execution_time = 60

; Errors go to the container's stderr, which is what `docker compose logs`
; reads. Never to the response body.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; Opcache: the code never changes inside a running container, so revalidation
; is pure overhead. A deploy replaces the container, which empties the cache.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
